<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={vac:'חופשה',late:'הגעה מאוחרת',early:'יציאה מוקדמת'};
const RL={admin:'מנהל אתר',manager:'מנהל מאשר',employee:'עובד'};
const IC={vac:'🌴',late:'⏰',early:'🏃'};
const SH={vac:'חופש',late:'מגיע',early:'יוצא'};
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const hf=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
const hn=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric'});
const hp=d=>{const o={};hf.formatToParts(d).forEach(p=>o[p.type]=p.value);return o};
function gem(n){
  const O=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],Tn=['','י','כ','ל'];
  const s=n===15?'טו':n===16?'טז':Tn[Math.floor(n/10)]+O[n%10];
  return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳';
}
const hday=d=>gem(parseInt(hn.format(d)));

  if(!n||!p){e.textContent='יש למלא שם משתמש וסיסמה';return}
  e.textContent='מתחבר…';
  try{
    const h=await sha(n);
    let cached=null;try{cached=localStorage.getItem('vm_em_'+h)}catch(_){}
    if(cached){
      try{await auth.signInWithEmailAndPassword(cached,await sha(cached+'|'+p));logAcc('ok',n);return}
      catch(x){if(x&&x.code==='auth/too-many-requests')throw x}
    }
    const lg=await db.collection('logins').doc(h).get();
    if(!lg.exists){await legacyMigrate(n,p,h);return}
    const em=lg.data().email;
    await auth.signInWithEmailAndPassword(em,await sha(em+'|'+p));
    logAcc('ok',n);
    try{localStorage.setItem('vm_em_'+h,em)}catch(_){}
  }catch(x){
    logAcc('fail',n);
    e.textContent=(x&&x.code==='auth/too-many-requests')?'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות':'שם משתמש או סיסמה שגויים'+((x&&(x.code||x.message))?' ('+(x.code||x.message)+')':'');
  }
}
async function legacyMigrate(n,p,h){
  let q=await db.collection('users').get();
  if(q.empty&&n==='דודו מנהל'&&p){await db.collection('users').doc('admin-dudu').set({name:'דודו מנהל',pass:p,role:'admin'});q=await db.collection('users').get()}
  const nz=v=>String(v==null?'':v).replace(/[\u200e\u200f\u202a-\u202e\u00a0]/g,' ').replace(/\s+/g,' ').trim();
  const d=q.docs.find(x=>nz(x.data().name)===nz(n)&&nz(x.data().pass)===nz(p));
  if(!d)throw new Error('bad: users='+q.size+' nameFound='+q.docs.some(x=>nz(x.data().name)===nz(n))+' project='+FIREBASE_CONFIG.projectId);
  const em='u'+rand()+'@vacations.app',c=await auth.createUserWithEmailAndPassword(em,await sha(em+'|'+p));
  await db.collection('uidmap').doc(c.user.uid).set({userId:d.id,role:d.data().role});
  await db.collection('logins').doc(h).set({email:em,uid:c.user.uid});
  await db.collection('users').doc(d.id).update({pass:firebase.firestore.FieldValue.delete()});
}
async function fbAuthCreate(email,pw){

  const c=await sec.auth().createUserWithEmailAndPassword(email,pw),uid=c.user.uid;

  $('#modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="md"><h3>הבקשה נשמרה ✓</h3><div class="sub">המייל האוטומטי לא נשלח מהדפדפן. לחצו לפתיחת מייל מוכן למנהל ושלחו אותו.</div><div class="mu" dir="ltr" style="font-size:12px;margin-bottom:8px;word-break:break-word">'+esc(lastMailErr)+'</div><div class="row"><a href="'+u+'" target="_blank" rel="noopener"><button class="pri">פתיחת מייל מוכן למנהל</button></a><button onclick="closeM()">סגירה</button></div></div></div>'}
let lastMailErr='';
async function sendMail(boss,d,text,em,isRem){
  try{
    const mp=mailParts(d),day=kd(d.date).toLocaleDateString('he-IL');if(!window.emailjs)throw new Error('no emailjs');
    
    // בניית תיאור הסוג כולל השעה בצורה ברורה
    const typeDesc = T[d.type] + (d.time ? ' (' + (d.type === 'late' ? 'מגיע ב־' : 'יוצא ב־') + d.time + ')' : '');
    const noteText = d.note || 'אין הערות';
    const an=analyze(d),shT=an.missing.length?'חסר עובד '+fromTo(an.missing):'לא נקבעו שעות עבודה ליום זה',exT=an.viol.length?'⚠ חריגה מדרישת הכיסוי: '+violText(an):'אין חריגה מדרישת הכיסוי (לפחות 2 עובדים, ומשעה 18:00 לפחות 3)';
    
    // לקיחת כתובת האתר הנוכחית באופן דינמי
    const currentAppUrl = window.location.origin + window.location.pathname;

    await emailjs.send('service_lnwmdw9','template_mk2vhtr',{
      from_name: d.name,
      from_email: MAIL_FROM,
      reply_to: MAIL_FROM,
      to_email: MAIL_TO,
      to_name: 'מנהל',
      start_date: 'יום '+WD[kd(d.date).getDay()]+', '+day,
      day_name: 'יום '+WD[kd(d.date).getDay()],
      full_date: fmtD(d.date),
      end_date: day,
      subject: (isRem?'תזכורת למחר – ':'')+mp.subject,
      message: mp.body,
      request_type: typeDesc,
      type_name: T[d.type],
      request_time: d.time || 'כל היום',
      shortage: shT,
      exception: exT,
      type: typeDesc,
      note: noteText,
      reason: noteText,
      title: isRem?'תזכורת למחר':'בקשה חדשה לאישור',
      app_url: currentAppUrl // שולח את הקישור הנוכחי הדינמי
    },{publicKey:'edHZJcWruFB4Ulcgh'});
    
    if(!isRem)toast('נשלח מייל למנהל · סוג: '+typeDesc+' · הערה: '+noteText);
  }catch(x){lastMailErr=((x&&x.status)?x.status+' ':'')+((x&&(x.text||x.message))||String(x));if(!isRem)mailFallback(d)}
}
async function delReq(){
  const r0=reqs.find(x=>x.id===medit);
  try{await db.collection('requests').doc(medit).delete();closeM();logEv('מחיקה',r0)}catch(x){$('#me').textContent='אירעה שגיאה במחיקה'}
}
function inboxView(){
  const mine=msgs.filter(m=>m.to===me.id&&m.kind!=='log').sort((a,b)=>b.ts-a.ts);
  let h='<div class="glass"><div class="row" style="justify-content:space-between;align-items:center;margin:0 0 10px"><b>תיבת הודעות</b>'+(mine.length?'<button onclick="delAllMsgs()">מחיקת כל ההודעות</button>':'')+'</div>';
  if(!mine.length)h+='<div class="mu">אין הודעות</div>';
  mine.forEach(m=>{
    let tail='';
    if(m.rid){
      const r=reqs.find(x=>x.id===m.rid);
      if(!r)tail='<div class="mu" style="margin-top:6px">הבקשה כבר אינה קיימת (נדחתה או בוטלה)</div>';
      else if(r.status==='pending'&&me.role==='manager')tail='<div class="row"><button class="pri" onclick="decide(\''+m.rid+'\',true)">אישור</button><button onclick="decide(\''+m.rid+'\',false)" style="color:var(--no)">דחייה</button></div>';
      else if(r.status==='approved')tail='<div class="ok" style="margin-top:6px">הבקשה אושרה</div>';
    }
    h+='<div class="msg'+(m.read?'':' un')+'"><div>'+(m.reminder?'<b style="color:var(--late)">⏰ תזכורת למחר · </b>':'')+esc(m.text)+'</div>'+(m.alert?'<div class="alt">⚠ '+esc(m.alert)+'</div>':'')+'<small>'+new Date(m.ts).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})+'</small>'+tail+(m.rid&&me.role==='manager'&&reqs.some(x=>x.id===m.rid&&x.status==='pending')?'':'<div class="row"><button style="color:var(--no)" onclick="delMsg(\''+m.id+'\')">מחיקת הודעה</button></div>')+'</div>';
  });
  return h+'</div>';
}
async function decide(rid,ok){
  const r=reqs.find(x=>x.id===rid);if(!r)return;
  try{
    if(ok)await db.collection('requests').doc(rid).update({status:'approved'});
    else await db.collection('requests').doc(rid).delete();
    logEv(ok?'אישור':'דחייה',r);
    await db.collection('messages').add({to:r.uid,text:'הבקשה שלך ('+desc(r)+' · '+fmtD(r.date)+') '+(ok?'אושרה ✓':'לא אושרה והוסרה מלוח השנה'),ts:Date.now(),read:false});
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
async function quickDel(id){const r0=reqs.find(x=>x.id===id);try{await db.collection('requests').doc(id).delete();closeM();logEv('מחיקה',r0);toast('הבקשה נמחקה')}catch(x){toast('אירעה שגיאה במחיקה')}}
async function delMsg(id){try{await db.collection('messages').doc(id).delete()}catch(x){toast('אירעה שגיאה במחיקה')}}
async function delAllMsgs(){try{for(const m of msgs.filter(m=>m.to===me.id&&m.kind!=='log'&&!(m.rid&&me.role==='manager'&&reqs.some(x=>x.id===m.rid&&x.status==='pending'))))await db.collection('messages').doc(m.id).delete();toast('ההודעות נמחקו')}catch(x){toast('אירעה שגיאה במחיקה')}}
function lockList(){return locks.slice().sort((a,b)=>a.id<b.id?-1:1).map(l=>'<div class="ur"><span>🔒 '+fmtD(l.id)+'</span><button onclick="unlock(\''+l.id+'\')">שחרור</button></div>').join('')||'<div class="mu">אין ימים נעולים</div>'}
async function unlock(k){try{await db.collection('locks').doc(k).delete()}catch(x){toast('אירעה שגיאה')}}
async function lockRange(on){
  const a=$('#lf').value,b=$('#lt').value||a,e=$('#le2');
  if(!a){e.textContent='יש לבחור תאריך';return}
  if(b<a){e.textContent='תאריך הסיום מוקדם מההתחלה';return}
  let d=kd(a);const end=kd(b),ks=[];
  while(d<=end&&ks.length<92){ks.push(key(d.getFullYear(),d.getMonth(),d.getDate()));d=at(d.getFullYear(),d.getMonth(),d.getDate()+1)}
  try{for(const k of ks){if(on)await db.collection('locks').doc(k).set({date:k,ts:Date.now()});else if(isLocked(k))await db.collection('locks').doc(k).delete()}e.textContent='';toast(on?'הימים ננעלו':'הנעילה שוחררה')}catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
function altSection(){
  const tk=todayK;
  const list=users.filter(u=>u.role!=='admin'&&(u.shifts||[]).length).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  let h='<b>סבב שבוע כן / שבוע לא</b><div class="sub">לעובד שעובד שבוע אחד ולא עובד בשבוע שאחריו. בחרו את היום הראשון של אחד משבועות העבודה שלו. מאותו יום הוא עובד 7 ימים, ואז 7 ימים לא, וכך הלאה. בשבועות החופש הוא לא ייספר במשמרות ובחוסרים</div>';
  if(!list.length)return h+'<div class="mu">אין עובדים עם שעות משמרת</div><div style="height:22px"></div>';
  list.forEach(u=>{
    const a=altOf(u),st=a?(altOn(u,tk)?'בסבב · השבוע עובד/ת':'בסבב · השבוע לא עובד/ת'):'עובד/ת כל שבוע';
    h+='<div class="ur" style="flex-wrap:wrap"><span><b>'+esc(u.name)+'</b> <span class="mu">· '+st+'</span></span><span class="row" style="margin:0;align-items:center"><input type="date" id="alt_'+u.id+'" value="'+esc(a)+'" style="width:auto;margin:0"><button class="pri" onclick="saveAlt(\''+u.id+'\')">שמירה</button>'+(a?'<button onclick="clearAlt(\''+u.id+'\')">ביטול סבב</button>':'')+'</span></div>';
  });
  return h+'<div class="err" id="ale"></div><div style="height:22px"></div>';
}

  const v=$('#alt_'+id).value,e=$('#ale');
  if(!v){e.textContent='יש לבחור תאריך שבו מתחיל שבוע עבודה';return}
  try{await db.collection('users').doc(id).update({alt:v});e.textContent='';toast('הסבב נשמר')}catch(x){e.textContent='אירעה שגיאה בשמירה, נסו שוב'}
}
async function clearAlt(id){
  try{await db.collection('users').doc(id).update({alt:''});$('#ale').textContent='';toast('העובד חזר לעבוד כל שבוע')}catch(x){$('#ale').textContent='אירעה שגיאה, נסו שוב'}
}
function staffView(){
  const adm=me.role==='admin';
  let h='<div class="glass" id="sf"><b>נעילת ימים</b><div class="sub">בחרו תאריך או טווח תאריכים. בימים נעולים לא ניתן להגיש בקשות חדשות (עד 3 חודשים בכל פעולה)</div><div class="row"><div style="flex:1;min-width:130px"><label>מתאריך</label><input id="lf" type="date"></div><div style="flex:1;min-width:130px"><label>עד תאריך</label><input id="lt" type="date"></div></div><div class="err" id="le2"></div><div class="row" style="margin-bottom:8px"><button class="pri" onclick="lockRange(true)">🔒 נעילה</button><button onclick="lockRange(false)">🔓 שחרור</button></div>'+lockList()+'<div style="height:22px"></div>'+altSection();
  if(adm){
    h+=(FB?statusBanner():'');
    h+='<b>הוספת עובד</b><div style="height:8px"></div><label>שם משתמש</label><input id="sn"><label>סיסמה</label><input id="sp"><div class="err" id="se"></div><button class="pri" onclick="addU()">הוספת עובד</button><div style="height:22px"></div><b>משתמשים</b><div class="sub">המנהל המאשר מקבל ומאשר את כל בקשות העובדים</div>';
    const ord={admin:0,manager:1,employee:2};
    users.slice().sort((a,b)=>ord[a.role]-ord[b.role]||a.name.localeCompare(b.name,'he')).forEach(u=>{
      h+='<div class="ur"><span><b>'+esc(u.name)+'</b> <span class="mu">· '+RL[u.role]+(FB?(u.pass?' · טרם התחבר/ה בגרסה המאובטחת':' · 🔒 מאובטח'):' · סיסמה: '+esc(u.pass))+'</span></span><span class="row" style="margin:0"><button onclick="editU(\''+u.id+'\')">עריכה</button>'+(u.role==='employee'?'<button onclick="setMgr(\''+u.id+'\')">הגדר כמנהל מאשר</button><button onclick="delU(\''+u.id+'\')" style="color:var(--no)">'+(armed===u.id?'לחצו שוב למחיקה':'מחיקה')+'</button>':'')+'</span></div>';
    });
    if(FB)h+=botSection();
  }
  return h+'</div>';

function editU(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  $('#modal').innerHTML='<div class="ov" onclick="if(event.target===this)closeM()"><div class="md"><h3>עריכת משתמש</h3><div class="sub">'+RL[u.role]+'</div><label>שם משתמש</label><input id="en" value="'+esc(u.name)+'"><label>'+(FB?'סיסמה חדשה (השאירו ריק ללא שינוי)':'סיסמה')+'</label><input id="ep" '+(FB?'':'value="'+esc(u.pass)+'"')+'><label>שעות עבודה (ראשון–חמישי)</label><input id="es" dir="ltr" placeholder="10:00-14:00, 18:00-22:00" value="'+esc((u.shifts||[]).join(', '))+'"><div class="err" id="ee2"></div><div class="row"><button class="pri" onclick="saveU(\''+id+'\')">שמירה</button><button onclick="closeM()">ביטול</button></div></div></div>';
}
async function saveU(id){
  const n=$('#en').value.trim(),p=$('#ep').value.trim(),e=$('#ee2');
  if(!n||(!p&&!FB)){e.textContent='יש למלא שם וסיסמה';return}
  if(users.some(u=>u.name===n&&u.id!==id)){e.textContent='שם המשתמש כבר קיים';return}
  try{
    if(FB)await fbUserSave(users.find(x=>x.id===id),n,p);
    await db.collection('users').doc(id).update(FB?{name:n,shifts:parseSh($('#es').value)}:{name:n,pass:p,shifts:parseSh($('#es').value)});
    for(const r of reqs.filter(x=>x.uid===id&&x.name!==n))await db.collection('requests').doc(r.id).update({name:n});
    closeM();toast('הפרטים נשמרו');
  }catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
async function setMgr(id){
  try{
    for(const u of users.filter(x=>x.role==='manager'&&x.id!==id)){await db.collection('users').doc(u.id).update({role:'employee'});if(FB)await setUidRole(u.id,'employee')}
    await db.collection('users').doc(id).update({role:'manager'});
    if(FB)await setUidRole(id,'manager');
    for(const r of reqs.filter(x=>x.status==='pending'&&x.uid!==id))await db.collection('messages').add({to:id,rid:r.id,text:r.name+' הגיש/ה בקשה: '+desc(r)+' · '+fmtD(r.date),ts:Date.now(),read:false});
    toast('המנהל המאשר עודכן');
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
async function saveMail(){
  const v=$('#em').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$('#ee').textContent='כתובת מייל לא תקינה';return}
  try{await db.collection('users').doc(me.id).update({email:v});$('#ee').textContent='';toast('המייל נשמר')}catch(x){$('#ee').textContent='אירעה שגיאה, נסו שוב'}
}
async function addU(){
  const n=$('#sn').value.trim(),p=$('#sp').value.trim(),e=$('#se');
  if(!n||!p){e.textContent='יש למלא שם משתמש וסיסמה';return}
  if(users.some(u=>u.name===n)){e.textContent='שם המשתמש כבר קיים';return}
  try{if(FB){const ref=db.collection('users').doc();await fbAccount(n,p,ref.id,'employee');await ref.set({name:n,role:'employee'})}else await db.collection('users').add({name:n,pass:p,role:'employee'});$('#sn').value='';$('#sp').value='';e.textContent='';toast('העובד נוסף')}catch(x){e.textContent='אירעה שגיאה, נסו שוב'}
}
async function delU(id){
  if(armed!==id){armed=id;render();return}
  armed='';
  try{
    for(const r of reqs.filter(x=>x.uid===id))await db.collection('requests').doc(r.id).delete();
    if(FB){const u=users.find(x=>x.id===id);if(u){const h=await sha(u.name),d=await db.collection('logins').doc(h).get();if(d.exists){await db.collection('uidmap').doc(d.data().uid).delete();await db.collection('logins').doc(h).delete()}}}
    await db.collection('users').doc(id).delete();
  }catch(x){toast('אירעה שגיאה, נסו שוב')}
}
