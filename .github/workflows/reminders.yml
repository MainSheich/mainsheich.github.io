name: reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node reminders.mjs
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
