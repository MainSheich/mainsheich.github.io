name: reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      now_iso:
        description: 'Test only: simulated time, e.g. 2026-11-17T12:45:00Z (leave empty for real time)'
        required: false
        default: ''
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node reminders.mjs
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          APP_URL: https://mainsheich.github.io/
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          NOW_ISO: ${{ github.event.inputs.now_iso }}
